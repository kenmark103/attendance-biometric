# Host ports are remapped (5434 / 8001 / 3001) to avoid clashing
# with your other local projects. Internal container-to-container traffic
# is unaffected — services still talk to each other on 5432/8000 inside
# the docker network; only what's exposed to your machine changed.
name: attendance-system

services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: attendance
      POSTGRES_PASSWORD: attendance
      POSTGRES_DB: attendance
    ports:
      - "5434:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/01-init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U attendance"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./api
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://attendance:attendance@db:5432/attendance
      JWT_SECRET: ${JWT_SECRET}
      AUTH_REQUIRED: ${AUTH_REQUIRED:-true}
      ACCESS_TTL_SECONDS: ${ACCESS_TTL_SECONDS:-900}
      REFRESH_TTL_DAYS: ${REFRESH_TTL_DAYS:-7}
      REFRESH_ABSOLUTE_DAYS: ${REFRESH_ABSOLUTE_DAYS:-30}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      ENTRA_TENANT_ID: ${ENTRA_TENANT_ID:-}
      ENTRA_CLIENT_ID: ${ENTRA_CLIENT_ID:-}
      ENTRA_CLIENT_SECRET: ${ENTRA_CLIENT_SECRET:-}
      ENTRA_REDIRECT_URI: ${ENTRA_REDIRECT_URI:-http://localhost:8001/auth/microsoft/callback}
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:-admin@attendance.internal}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-}
    ports:
      - "8001:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    volumes:
      - ./api/app:/app/app
      - ./api/tests:/app/tests
      - ./db:/app/db
      - ./scripts:/scripts
      - ./data:/data

  frontend:
    build:
      context: ./frontend
    restart: unless-stopped
    ports:
      - "3001:80"
    depends_on:
      api:
        condition: service_healthy

  # COSEC attendance ingestion worker — same image as api, different command.
  # Polls attendance-daily every POLL_INTERVAL_SECONDS and upserts the raw
  # (user_id, process_date) rows. No ports: never serves traffic.
  ingestor:
    build: ./api
    command: python -m app.ingestion.cli run
    environment:
      DATABASE_URL: postgresql://attendance:attendance@db:5432/attendance
      COSEC_BASE_URL: ${COSEC_BASE_URL}
      COSEC_USER: ${COSEC_USER}
      COSEC_PASSWORD: ${COSEC_PASSWORD}
      COSEC_TIMEOUT_SECONDS: ${COSEC_TIMEOUT_SECONDS:-60}
      COSEC_MAX_RANGE_DAYS: ${COSEC_MAX_RANGE_DAYS:-31}
      POLL_INTERVAL_SECONDS: ${POLL_INTERVAL_SECONDS:-300}
      POLL_LOOKBACK_DAYS: ${POLL_LOOKBACK_DAYS:-3}
      MAX_PLAUSIBLE_SPAN_MIN: ${MAX_PLAUSIBLE_SPAN_MIN:-960}
      MAX_MALFORMED_RATIO: ${MAX_MALFORMED_RATIO:-0.05}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./api/app:/app/app
      - ./data:/data
    restart: unless-stopped

  # Promoter: keeps the dashboard near-live by moving freshly polled COSEC
  # staging rows into attendance_records every PROMOTE_INTERVAL_SECONDS.
  # Idempotent (insert-only-new); existing rows are never touched. No ports.
  promoter:
    build: ./api
    command: python /scripts/promote_loop.py
    environment:
      DATABASE_URL: postgresql://attendance:attendance@db:5432/attendance
      PROMOTE_INTERVAL_SECONDS: ${PROMOTE_INTERVAL_SECONDS:-300}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./scripts:/scripts
    restart: unless-stopped

  # One-off, not started by `docker compose up`. Run explicitly:
  #   docker compose --profile tools run --rm loader
  # No host pip install needed — psycopg2 already lives in this image.
  loader:
    build: ./api
    environment:
      DATABASE_URL: postgresql://attendance:attendance@db:5432/attendance
      API_URL: http://api:8000
    depends_on:
      db:
        condition: service_healthy
      api:
        condition: service_started
    volumes:
      - ./data:/data
      - ./scripts:/scripts
    entrypoint: ["python", "/scripts/load_data.py", "/data/data.json"]
    profiles: ["tools"]

volumes:
  pgdata:
